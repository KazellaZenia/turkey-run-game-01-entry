<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a0c; }

    position: fixed; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 1280 / 480));

    display: block; touch-action: none; cursor: pointer;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>

<canvas id="game" aria-label="Gobble Dash: a turkey escapes the farmer, the oven and the carving knife across 1000 metres of farmyard"></canvas>
